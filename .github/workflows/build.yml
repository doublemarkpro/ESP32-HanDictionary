name: Build Boards

on:
  push:
    branches: [main, 'ci/*']
    paths-ignore:
      - '**/*.md'
      - 'docs/ui/**/*.png'
      - 'docs/ui/**/*.ppm'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/ui/**/*.png'
      - 'docs/ui/**/*.ppm'
  workflow_dispatch:
    inputs:
      scope:
        description: 'tab5: product builds; all: full IDF 6.0.2 board matrix'
        type: choice
        options: [tab5, all]
        default: tab5
      include_s31:
        description: 'With all: also run experimental ESP32-S31 / IDF 6.1 (known UHCI incompatibility)'
        type: boolean
        default: false

permissions:
  contents: read

# Replace outdated automatic runs for the same branch/PR. Keep manual diagnostics separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'tab5' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Test code and resources; select variants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: espressif/idf:v6.0.2
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test build and content tooling
        run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test graphics and font resources
        run: |
          npm ci --prefix tools/ui-assets
          node --test tools/ui-assets/*.test.cjs
      - id: select
        name: Select product variants (full matrix only on manual request)
        shell: bash
        env:
          BUILD_SCOPE: ${{ inputs.scope || 'tab5' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/build.py --list-boards --json > /tmp/han-variants.json
          SELECTED=$(python scripts/select_ci_variants.py --event "$EVENT_NAME" --scope "$BUILD_SCOPE" < /tmp/han-variants.json)
          echo "variants=$SELECTED" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
        run: |
          source "$IDF_PATH/export.sh"
          if [[ "$VARIANT" == m5stack-tab5-han-dictionary* ]]; then
            python scripts/build.py "$BOARD" --name "$VARIANT" --language zh-CN --wake-word nihaoxiaozhi
          else
            python scripts/build.py "$BOARD" --name "$VARIANT"
          fi
      - name: Enforce product flash capacity (512 KiB minimum free)
        if: startsWith(matrix.name, 'm5stack-tab5-han-dictionary')
        run: python tools/capacity_report.py
      - uses: actions/upload-artifact@v6
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 7

  esp32s31-idf61:
    name: Experimental ${{ matrix.full_name }} with IDF 6.1
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all' && inputs.include_s31
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: espressif/esp32-s31-function-coreboard-1
            name: esp32-s31-function-coreboard-1
            full_name: espressif-esp32-s31-function-coreboard-1
          - board: espressif/esp32-s31-korvo-1
            name: esp32-s31-korvo-1
            full_name: espressif-esp32-s31-korvo-1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build ESP32-S31 variant (failure remains visible)
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD" --name "$VARIANT"
      - uses: actions/upload-artifact@v6
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 7
